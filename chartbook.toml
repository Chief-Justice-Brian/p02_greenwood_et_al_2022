[config]
type = "pipeline"
chartbook_format_version = "0.0.2"

[site]
title = "Predictable Financial Crises"
author = "Brian Nguyen & Clara Duan"
copyright = "2026"
logo_path = ""
favicon_path = ""

[pipeline]
id = "P0"
pipeline_name = "Predictable Financial Crises"
pipeline_description = "Replication and post-publication extension of Greenwood, Hanson, Shleifer & Sorensen (2022), Predictable Financial Crises, for FINM 32900."
lead_pipeline_developer = "Brian Nguyen & Clara Duan"
contributors = ["Brian Nguyen & Clara Duan"]
software_modules_command = "module load anaconda3/3.11.4 TeXLive/2023"
runs_on_grid_or_windows_or_other = "Windows/Linux/MacOS"
git_repo_URL = "https://github.com/Chief-Justice-Brian/p02_greenwood_et_al_2022"
README_file_path = "./README.md"
site_dir = "./docs_src/"

[notebooks]


[notebooks.01_predictable_financial_crises_project_tour]
notebook_name = "Predictable Financial Crises Project Tour"
notebook_description = "Guided tour of the cleaned panel, replication exhibits, post-publication update, and extensions."
notebook_path = "_output/01_predictable_financial_crises_project_tour.ipynb"


[dataframes]


[dataframes.credit_panel]
dataframe_name = "Cleaned Credit Panel"
short_description_df = "One row per (country, year): spliced three-year business, household, and total debt-to-GDP changes and real debt growth, with a source label beside every measure."
data_sources = ["IMF Global Debt Database", "BIS Total Credit Statistics", "JST MacroHistory"]
data_providers = ["IMF", "BIS", "JST"]
links_to_data_providers = ["https://www.imf.org/external/datamapper/datasets/GDD", "https://data.bis.org/topics/TOTAL_CREDIT", "https://www.macrohistory.net/database/"]
topic_tags = ["Financial Crises", "Credit Growth"]
type_of_data_access = "Public"
data_license = "No"
license_expiration_date = "N/A"
need_to_contact_provider = "No"
provider_contact_info = ""
restriction_on_use = "No"
how_is_pulled = "Web API via Python"
path_to_parquet_data = "./_data/credit_panel.parquet"
path_to_excel_data = ""
date_col = "year"
dataframe_docs_path = "./docs_src/dataframes/credit_panel.md"


[dataframes.equity_panel]
dataframe_name = "Cleaned Equity Panel"
short_description_df = "One row per (country, year): spliced three-year real equity-price growth from IMF share prices, JST, and OECD share prices."
data_sources = ["IMF share price indices", "JST MacroHistory", "OECD share prices"]
data_providers = ["IMF", "JST", "OECD"]
links_to_data_providers = ["https://data.imf.org/", "https://www.macrohistory.net/database/", "https://data-explorer.oecd.org/"]
topic_tags = ["Financial Crises", "Asset Prices", "Equity"]
type_of_data_access = "Public"
data_license = "No"
license_expiration_date = "N/A"
need_to_contact_provider = "No"
provider_contact_info = ""
restriction_on_use = "No"
how_is_pulled = "Web API via Python"
path_to_parquet_data = "./_data/equity_panel.parquet"
path_to_excel_data = ""
date_col = "year"
dataframe_docs_path = "./docs_src/dataframes/equity_panel.md"


[dataframes.house_price_panel]
dataframe_name = "Cleaned House Price Panel"
short_description_df = "One row per (country, year): spliced three-year real house-price growth from BIS residential property prices, OECD analytical house prices, and JST."
data_sources = ["BIS Residential Property Prices", "OECD Analytical House Prices", "JST MacroHistory"]
data_providers = ["BIS", "OECD", "JST"]
links_to_data_providers = ["https://data.bis.org/topics/RPP", "https://data-explorer.oecd.org/", "https://www.macrohistory.net/database/"]
